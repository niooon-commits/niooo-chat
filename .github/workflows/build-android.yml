name: Build Android APK & Update Single Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-single-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APKs (Release & Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p artifacts
          
          # Locate Release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/niooo-chat-release.apk
            echo "Found Release APK: $RELEASE_APK -> artifacts/niooo-chat-release.apk"
          fi

          # Locate Debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/niooo-chat-debug.apk
            echo "Found Debug APK: $DEBUG_APK -> artifacts/niooo-chat-debug.apk"
          fi

          ls -lh artifacts/

      - name: Update or Replace APK in Single GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="niooo Chat - Latest APK Build"
          NOTES_FILE="/tmp/release_notes.md"
          
          cat << EOF > "$NOTES_FILE"
          ## 📱 niooo Chat - Latest APK Release

          This single release is automatically updated with the latest compiled Android APK on every build.
          There is always only **one** unified release containing the newest build.

          ### 📦 Download Links
          - 🚀 **Release APK (Signed):** [niooo-chat-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/niooo-chat-release.apk)
          - 🛠️ **Debug APK:** [niooo-chat-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/niooo-chat-debug.apk)

          ### ℹ️ Build Metadata
          - **Application:** niooo Chat
          - **Package ID:** \`com.niooonucc.chat\`
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Branch:** \`${{ github.ref_name }}\`
          - **Last Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          # Check if the release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists. Updating release metadata and replacing APK assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" artifacts/*.apk --clobber
          else
            echo "Creating single release '$TAG' with APK assets..."
            gh release create "$TAG" artifacts/*.apk --title "$TITLE" --notes-file "$NOTES_FILE" --latest
          fi

          echo "Successfully updated single release: $TAG"
